{% extends "itreporting/base.html" %}
{% block content %}
<ul>
    {% for course in courses %}
            <h1>My Course: {{ course.name }}</h1>
            <small class="text-muted">Course Code: {{ course.code }}</small>
            <p>About The Course:</p>
            <p>{{ course.description }}</p>
    {% endfor %}
</ul>
<div class="m-5 text-center">
    <a href="{% url 'modules' %}" class="btn btn-primary btn-lg px-5 py-3">Available Modules</a>
</div>
{% endblock content %}
